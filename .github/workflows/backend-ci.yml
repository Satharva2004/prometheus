name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-lint:
    name: Lint & Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python Code Syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/app/api/endpoints/ai.py
          python -m py_compile backend/app/api/endpoints/litcode.py
          python -m py_compile backend/app/api/endpoints/sap.py

      - name: Run Pytest Test Suite
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          cd backend
          pytest tests/

  deploy-vps:
    name: Deploy to Server via SSH
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/Promptly/backend || cd /var/www/promptly/backend || cd ~/backend
            git pull origin main || git pull origin master
            source venv/bin/activate || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart fastapi || sudo systemctl restart uvicorn || pm2 restart backend || pm2 restart fastapi || true
